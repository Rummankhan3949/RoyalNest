name: fyp_royalnest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  fl_chart: ^0.69.0
  http: ^1.2.2
  google_sign_in: ^6.1.6
  image_picker: ^1.0.4
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  file_saver: ^0.2.14
  media_store_plus: ^0.1.3
  intl: ^0.19.0
  open_file: ^3.5.0
  panorama_viewer: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/royalnest_logo.png"
  image_path: "assets/royalnest_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/tour/
    - assets/tour/royal_smart_city/
    - assets/tour/royal_city/
    - assets/tour/royal_homes/
